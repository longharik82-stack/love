<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Кирилл ❤️ Диана</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #ffe5ec, #fff5f7);
    color: #3b2028;
    text-align: center;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 30px 18px 50px;
}

h1 {
    font-size: 34px;
    margin: 0 0 8px;
}

.date {
    color: #9b6673;
    font-size: 17px;
    margin-bottom: 30px;
}

/* СЧЁТЧИК */

.counter {
    background: rgba(255,255,255,0.85);
    border-radius: 22px;
    padding: 20px 10px;
    margin-bottom: 25px;
    box-shadow: 0 8px 25px rgba(100,40,60,0.1);
}

.counter div {
    font-size: 16px;
    margin-bottom: 7px;
}

.counter b {
    display: block;
    font-size: 22px;
}

/* ТЕКСТ */

.message {
    background: white;
    border-radius: 22px;
    padding: 25px 20px;
    line-height: 1.6;
    font-size: 17px;
    box-shadow: 0 8px 25px rgba(100,40,60,0.1);
    margin-bottom: 25px;
}

/* ФОТО */

.photos {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 30px;
}

.photo {
    height: 190px;
    border-radius: 18px;
    overflow: hidden;
    background: #f8cbd6;
    box-shadow: 0 6px 18px rgba(100,40,60,0.1);
}

.photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* КНОПКА */

button {
    border: none;
    background: #e75475;
    color: white;
    padding: 14px 25px;
    border-radius: 30px;
    font-size: 17px;
    cursor: pointer;
    box-shadow: 0 7px 18px rgba(200,60,90,0.25);
}

button:active {
    transform: scale(0.96);
}

/* СЕРДЕЧКИ */

.heart {
    position: fixed;
    pointer-events: none;
    animation: fly 2s ease-out forwards;
    font-size: 25px;
    z-index: 999;
}

@keyframes fly {

    0% {
        transform: translateY(0) scale(1);
        opacity: 1;
    }

    100% {
        transform: translateY(-250px) scale(1.5);
        opacity: 0;
    }

}

/* ДЛЯ МАЛЕНЬКОГО ЭКРАНА */

@media (max-width: 400px) {

    h1 {
        font-size: 29px;
    }

    .photo {
        height: 150px;
    }

    .counter b {
        font-size: 19px;
    }

}

</style>
</head>

<body>

<div class="container">

    <h1>Кирилл ❤️ Диана</h1>

    <div class="date">
        27.09.2026
    </div>


    <!-- СЧЁТЧИК -->

    <div class="counter">

        <div>
            Мы вместе уже
        </div>

        <b id="timer">
            0 дней 00:00:00
        </b>

    </div>


    <!-- СООБЩЕНИЕ -->

    <div class="message">

        Я просто хотел сделать для тебя что-то,
        что останется на память. Собрал сюда наши
        моменты, потому что каждый из них для меня
        особенный. И это только начало нашей истории. ❤️

    </div>


    <!-- ФОТО -->

    <div class="photos">

        <div class="photo">
            <img src="IMG_7563.jpeg" alt="Фото 1">
        </div>

        <div class="photo">
            <img src="IMG_7778.jpeg" alt="Фото 2">
        </div>

        <div class="photo">
            <img src="IMG_7984.jpeg" alt="Фото 3">
        </div>

        <div class="photo">
            <img src="IMG_7987.jpeg" alt="Фото 4">
        </div>

    </div>


    <!-- КНОПКА -->

    <button onclick="makeHearts()">
        Нажми ❤️
    </button>

</div>


<script>

/* ДАТА НАЧАЛА */

const startDate = new Date(2026, 8, 27);


/* ОБНОВЛЕНИЕ СЧЁТЧИКА */

function updateTimer() {

    const now = new Date();

    const difference = Math.max(
        0,
        now - startDate
    );

    const days = Math.floor(
        difference / 86400000
    );

    const hours = Math.floor(
        (difference % 86400000) / 3600000
    );

    const minutes = Math.floor(
        (difference % 3600000) / 60000
    );

    const seconds = Math.floor(
        (difference % 60000) / 1000
    );


    const h = String(hours).padStart(2, "0");
    const m = String(minutes).padStart(2, "0");
    const s = String(seconds).padStart(2, "0");


    document.getElementById("timer").textContent =
        `${days} дней ${h}:${m}:${s}`;

}


/* ЗАПУСК */

updateTimer();

setInterval(updateTimer, 1000);


/* СЕРДЕЧКИ */

function makeHearts() {

    for (let i = 0; i < 15; i++) {

        const heart =
            document.createElement("div");

        heart.className = "heart";

        heart.textContent = "❤️";

        heart.style.left =
            Math.random() * 100 + "vw";

        heart.style.top =
            (60 + Math.random() * 30) + "vh";

        heart.style.animationDelay =
            Math.random() * 0.5 + "s";

        document.body.appendChild(heart);


        setTimeout(() => {

            heart.remove();

        }, 2500);

    }

}

</script>

</body>
</html>
